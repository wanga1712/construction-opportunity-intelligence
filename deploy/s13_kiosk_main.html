function renderPipeline(t,r){var c=t.commercial||{},d=t.documents||{},n=t.normalization||{},items=[{l:L.received,v:fmt(t.received),s:fmt(t.received)+' \u0437\u0430 \u0441\u0435\u0433\u043e\u0434\u043d\u044f'},{l:L.filter,v:fmt(c.accepted),s:fmt(c.accepted)+' '+L.accepted+' · '+fmt(c.rejected)+' '+L.rejected+' · '+fmt(c.error)+' '+L.review+' · '+fmt((t.ai_states||{}).RUNNING||0)+' AI · '+fmt(Number((t.ai_states||{}).UNASSESSED||0)+Number((t.ai_states||{}).QUEUED||0))+' '+L.waiting,split:true},{l:L.docs,v:fmt(d.needs_research),s:fmt(d.needs_research)+' '+L.needDocs},{l:L.norm,v:fmt(n.normalized),s:r.normalization&&r.normalization.state==='OFF'?'OFF':fmt(n.pending)+' '+L.waiting},{l:L.ready,v:fmt((t.ready_cards||{}).count),s:fmt((t.ready_cards||{}).count)+' '+L.ready.toLowerCase()}];$('todayPipeline').innerHTML=items.map(function(x){return'<div class="stage"><div class="stage-label">'+esc(x.l)+'</div><div class="stage-value">'+esc(x.v)+'</div>'+(x.split?'<div class="split"><span class="green">'+esc(fmt(c.accepted))+' '+L.accepted+'</span><span class="red">'+esc(fmt(c.rejected))+' '+L.rejected+'</span><span class="orange">'+esc(fmt(c.error))+' '+L.review+'</span><span>'+esc(fmt((t.ai_states||{}).RUNNING||0))+' AI · '+esc(fmt(Number((t.ai_states||{}).UNASSESSED||0)+Number((t.ai_states||{}).QUEUED||0)))+' '+L.waiting+'</span></div>':'<div class="stage-sub">'+esc(x.s)+'</div>')+'</div>'}).join('');txt('todayTitle',L.today+' · '+fmt(t.received)+' '+('\u0437\u0430\u043a\u0443\u043f\u043e\u043a').toUpperCase());txt('todayNote',fmt(c.denominator)+' '+('\u0432 \u043e\u0434\u043d\u043e\u0439 \u043a\u043e\u0433\u043e\u0440\u0442\u0435'))}
function renderAttention(m,t){var r=m.runtime||{},d=r.documents||{},n=r.normalization||{},a=[];if(r.autonomous&&r.autonomous.state==='failed')a.push(['red',L.autonomousFailed]);if(d.workers_running===0&&(Number(d.queue_ready||0)>0||Number(d.stale||0)>0))a.push(['orange',L.processingDocs+' STOPPED · '+fmt(d.queue_ready)+' '+L.waiting+' · '+fmt(d.stale)+' stale']);if(n.state==='OFF')a.push(['red',L.normalizationOff+' · '+fmt(n.pending)+' '+L.waiting]);if(Number((t.commercial||{}).error||0)>0)a.push(['orange',fmt(t.commercial.error)+' '+('\u0437\u0430\u043a\u0443\u043f\u043e\u043a')+' · '+L.review]);txt('attentionTitle',L.attention);$('attentionList').innerHTML=a.slice(0,3).map(function(x){return'<div class="att-item '+x[0]+'"><span class="att-mark">'+(x[0]==='red'?'!':'●')+'</span><span>'+esc(x[1])+'</span></div>'}).join('')||'<div class="empty">'+('\u0410\u043a\u0442\u0443\u0430\u043b\u044c\u043d\u044b\u0445 \u043f\u0440\u043e\u0431\u043b\u0435\u043c \u043d\u0435\u0442')+'</div>'}
function eventText(e){var s=String(e.stage||'').toLowerCase(),r=String(e.result||'').toUpperCase(),id=e.procurement&&e.procurement!=='—'?' '+('\u0437\u0430\u043a\u0443\u043f\u043a\u0430')+' '+e.procurement:'';if(r==='FAILED')return'\u041e\u0448\u0438\u0431\u043a\u0430 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0438'+id;if(s==='assessment')return(r==='DONE'?'AI \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u043b \u043e\u0446\u0435\u043d\u043a\u0443':'AI \u043e\u0446\u0435\u043d\u0438\u0432\u0430\u0435\u0442')+id;if(s==='feeder')return'\u041f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u044b \u043d\u043e\u0432\u044b\u0435 \u0437\u0430\u043a\u0443\u043f\u043a\u0438';return(r==='DONE'?'\u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u0430 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432':'\u041e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0430 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432')+id}function renderEvents(es){txt('eventsTitle',L.events);var a=(es||[]).slice(-3).reverse();$('eventList').innerHTML=a.length?a.map(function(e){return'<div class="event"><span class="event-time">'+esc(String(e.time||'').slice(11,16)||L.na)+'</span><span class="event-text">'+esc(eventText(e))+'</span></div>'}).join(''):'<div class="empty">'+L.noEvents+'</div>'}
function renderNow(m){var t=m.today_truth||{},r=m.runtime||{},j=currentTask(m),cpu=m.cpu_detail||{},g=m.gpu||{},tp=m.temperatures||{};txt('nowEyebrow','\u0421\u0415\u0419\u0427\u0410\u0421');txt('nowTitle',j?j.title:L.waitingTask);txt('nowAction',j?j.action:(r.feeder&&r.feeder.state==='active'?'\u041e\u0436\u0438\u0434\u0430\u0435\u0442 \u043d\u043e\u0432\u044b\u0435 \u0437\u0430\u0434\u0430\u0447\u0438':''));txt('nowElapsed',j&&j.elapsed!==null&&j.elapsed!==undefined?elapsed(j.elapsed)+' \u0432 \u0440\u0430\u0431\u043e\u0442\u0435':'');$('hardwareLine').innerHTML='CPU <strong>'+esc(pct(cpu.busy_pct??cpu.total))+'</strong> \u00b7 GPU <strong>'+esc(pct(g.util))+'</strong> \u00b7 <strong>'+esc(temp(tp.display??tp.package))+'</strong>';var st=(m.system_status||{}).state||'UNKNOWN';txt('systemState',st==='CRITICAL'?'CRITICAL':st==='WARNING'?'\u0412\u041d\u0418\u041c\u0410\u041d\u0418\u0415':j?'\u0420\u0410\u0411\u041e\u0422\u0410\u0415\u0422':'\u041e\u0416\u0418\u0414\u0410\u0415\u0422');$('systemState').className='sys '+st;renderPipeline(t,r);renderAttention(m,t);renderEvents(r.events)}
function pair(label,value){return'<div class="metric"><label>'+esc(label)+'</label><b>'+esc(value)+'</b></div>'}function limit(label,value){return'<div class="limit"><label>'+esc(label)+'</label><b>'+esc(value)+'</b></div>'}function renderResources(m){var c=m.cpu_detail||{},cap=c.cap||{},p=Array.isArray(c.per)?c.per:[],t=m.temperatures||{},g=m.gpu||{},ram=m.mem||{},r=m.runtime||{};txt('cpuHeading','CPU · '+fmt(p.length)+' '+L.cores);txt('cpuLead',pct(c.busy_pct??c.total)+' · '+mhz(cap.cur_mhz??c.freq_mhz));txt('cpuTemps','CPU package: '+temp(t.package)+' · Hottest core: '+temp(t.core_max)+' · Display: '+temp(t.display));$('cpuCores').innerHTML=p.length?p.map(function(v,i){var w=isFinite(Number(v))?Math.max(0,Math.min(100,Number(v))):0;return'<div class="core"><div class="core-head"><span>C'+i+'</span><b>'+pct(v)+'</b></div><div class="bar"><span style="width:'+w+'%"></span></div></div>'}).join(''):'<div class="empty">'+L.na+'</div>';$('cpuLimits').innerHTML=[limit(L.maxPerf,pct(cap.cap_pct)),limit(L.minPerf,pct(cap.min_pct)),limit(L.currentFreq,mhz(cap.cur_mhz)),limit(L.freqCap,mhz(cap.scaling_max_mhz)),limit(L.hwMax,mhz(cap.hw_max_mhz)),limit(L.turbo,cap.no_turbo===null||cap.no_turbo===undefined?L.na:cap.no_turbo?'OFF':'ON'),limit(L.governor,cap.governor||L.na)].join('');txt('gpuHeading','GPU'+(r.gpu_model?' · '+r.gpu_model:''));txt('gpuLead',pct(g.util)+' · '+temp(g.temp));var state=g.power_state;txt('gpuState',state==='POWER_LIMIT'?L.powerLimit:state==='NEAR_POWER_CAP'?L.nearPower:state==='NOT_POWER_LIMITED'?L.noPowerLimit:L.na);var metrics=[[L.vram,gb(g.vram_used)+' / '+gb(g.vram_total)],[L.power,fmt(g.power,1)+' W'],[L.limit,fmt(g.limit,1)+' W'],[L.defaultLimit,fmt(g.default_limit,1)+' W'],[L.maxLimit,fmt(g.max_limit,1)+' W'],[L.headroom,fmt(g.headroom_w,1)+' W'],[L.gpuClock,fmt(g.clock_cur_mhz)+' MHz'],[L.memClock,fmt(g.mem_clock_cur_mhz)+' MHz'],[L.fan,pct(g.fan)]];$('gpuMetrics').innerHTML=metrics.map(function(x){return pair(x[0],x[1])}).join('');var thr=g.t function sum(o){if(!o||typeof o!=='object')return null;var a=Object.values(o);if(!a.length||a.some(function(x){return x===null||x===undefined||!isFinite(Number(x))}))return null;return a.reduce(function(x,y){return x+Number(y)},0)}function medalRows(id,o,max){var keys=['GOLD','SILVER','BRONZE','WOOD'];$(id).innerHTML=keys.map(function(k){var v=o&&o[k],w=v===null||v===undefined?0:Math.max(0,Math.min(100,100*Number(v)/Math.max(1,max)));return'<div class="medal-row"><span>'+k+'</span><b>'+fmt(v)+'</b><div class="medal-track"><span style="width:'+w+'%"></span></div></div>'}).join('')}
function renderOpsCommercial(m){var c=((m.command||{}).commercial)||{},o=c.open||{},a=c.awarded||{},all={};['GOLD','SILVER','BRONZE','WOOD'].forEach(function(k){all[k]=Number(o[k]||0)+Number(a[k]||0)});txt('commercialTotal',fmt(c.live_total));txt('openTotal',fmt(sum(o)));txt('awardedTotal',fmt(sum(a)));$('commercialMedals').innerHTML=['GOLD','SILVER','BRONZE','WOOD'].map(function(k){return '<span>'+k+' <b>'+fmt(all[k])+'</b></span>'}).join('')}
function render(m){if(!m)return;txt('clock',new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));renderNow(m);renderResources(m);renderOpsCommercial(m);auditLayout()}async function tick(){try{var r=await fetch('/api/metrics',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json())}catch(e){txt('systemState','\u041d\u0415\u0422 \u0421\u0412\u042f\u0417\u0418');$('systemState').className='sys CRITICAL';auditLayout()}}tick();setInterval(tick,3000);
