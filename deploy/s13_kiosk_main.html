<!doctype html>
<html lang="ru" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S13 · Операционный экран</title>
<style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#131c27;--panel2:#192433;--line:#2a394b;--text:#edf3fa;--muted:#9babbc;--green:#38c979;--blue:#64a9f5;--orange:#f4ad42;--red:#ff626b;--gray:#758396}
*{box-sizing:border-box}html,body{direction:ltr!important;margin:0;min-height:100%;width:100%;max-width:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;overflow-x:hidden}body{font-size:16px}
header{direction:ltr!important;display:grid;grid-template-columns:minmax(0,1fr) auto auto;height:54px;padding:8px 22px;display:flex;align-items:center;gap:22px;background:#101824;border-bottom:1px solid var(--line)}.brand{grid-column:1;grid-row:1;justify-self:start;font-size:21px;font-weight:800;letter-spacing:.04em;color:#8fc2ff}.updated{grid-column:2;grid-row:1;color:var(--muted);font-size:13px}.header-right{grid-column:3;grid-row:1;margin-left:0;display:flex;align-items:center;gap:18px}.status-pill,.tech-link{border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--text);font-size:13px;text-decoration:none}.status-pill{font-weight:750}.good{color:var(--green)!important}.info{color:var(--blue)!important}.warn{color:var(--orange)!important}.bad{color:var(--red)!important}.off{color:var(--gray)!important}
main{display:grid;grid-template-columns:minmax(0,1fr);width:100%;max-width:1920px;margin:0 auto;padding:12px 18px 24px;gap:11px;min-width:0}main>*{width:100%;min-width:0}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;overflow:hidden}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:800;margin-bottom:8px}.hero{direction:ltr!important;display:grid;grid-template-areas:"now resources";grid-template-columns:minmax(0,1.45fr) minmax(400px,1fr);gap:12px;min-height:202px}.now{grid-area:now;display:flex;flex-direction:column;justify-content:center;min-width:0}.now h1{margin:0 0 10px;font-size:15px;letter-spacing:.18em;color:#a9bacb}.now-state{font-size:clamp(28px,2.3vw,43px);line-height:1.12;font-weight:800;max-width:1000px}.now-action{margin-top:10px;color:#b9c8d8;font-size:17px}.now-meta{display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:14px;color:var(--muted);font-size:14px}.now-meta strong{color:var(--text);font-size:16px}.resource-panel{grid-area:resources;display:grid;align-content:center;gap:15px}.resource{min-width:0}.resource-head{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:750}.resource-head b{font-size:22px}.track{height:10px;background:#263447;border-radius:9px;overflow:hidden;margin-top:6px}.track span{display:block;height:100%;width:0;background:var(--blue);border-radius:9px;transition:width .5s}.resource.gpu .track span{background:#55c78a}.resource.ram .track span{background:#ad8cf5}
h2{font-size:15px;margin:0 0 10px;letter-spacing:.05em}.pipeline{direction:ltr!important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stage{position:relative;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:102px}.stage:not(:last-child):after{content:"›";position:absolute;right:-11px;top:30px;z-index:1;font-size:23px;color:var(--muted)}.stage-title{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em}.stage-state{font-size:15px;font-weight:800;margin-top:9px}.stage-detail{font-size:12px;line-height:1.35;color:#b6c4d3;margin-top:5px;overflow-wrap:anywhere}.large-count{font-size:27px;font-weight:850;line-height:1}
.funnel{direction:ltr!important;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.funnel-card{min-width:0;background:#101824;border:1px solid var(--line);border-radius:10px;padding:11px 12px}.funnel-label{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.06em;line-height:1.2;min-height:26px}.funnel-value{font-size:27px;font-weight:850;margin-top:5px}.funnel-note{color:var(--muted);font-size:12px;line-height:1.3;margin-top:4px}.funnel-sub{font-size:12px;color:#d4e0ec;margin-top:5px}
.problems{direction:ltr!important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.problem{min-width:0;border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:#101824;min-height:77px}.problem.red{border-left:5px solid var(--red)}.problem.orange{border-left:5px solid var(--orange)}.problem.blue{border-left:5px solid var(--blue)}.problem-title{font-weight:850;font-size:14px}.problem-text{color:#c1ceda;margin-top:5px;font-size:13px;line-height:1.35}.empty-problems{color:var(--green);font-size:17px;font-weight:800;padding:14px}
.bottom{direction:ltr!important;display:grid;grid-template-columns:1.1fr .9fr;gap:11px}.activity-list{display:grid;gap:4px}.activity{display:grid;grid-template-columns:54px 110px minmax(0,1fr);align-items:center;gap:8px;border-bottom:1px solid #263344;padding:6px 2px;font-size:13px;min-width:0}.activity-time,.activity-stage{color:var(--muted);font-size:12px}.activity-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.commerce-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;margin-bottom:9px}.commerce-head strong{font-size:25px}.commerce-head span{font-size:13px;color:var(--muted)}.medal-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}.medal-row{display:grid;grid-template-columns:62px 38px minmax(50px,1fr);gap:7px;align-items:center;font-size:12px;font-weight:750}.medal-track{height:8px;background:#263447;border-radius:6px;overflow:hidden}.medal-track span{display:block;height:100%;background:var(--blue)}.commercial-extra{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:1200px){.hero{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}.stage:nth-child(3):after{display:none}.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}.bottom{grid-template-columns:1fr}}
@media(max-width:680px){header{padding:8px 12px}.updated{display:none}main{padding:8px}.panel{padding:12px}.pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}.stage:after{display:none!important}.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}.problems{grid-template-columns:1fr}.medal-list{grid-template-columns:1fr}.activity{grid-template-columns:44px 88px minmax(0,1fr)}}
</style></head><body>
<header><div class="brand">S13 · СИСТЕМА ЗАКУПОК</div><div id="updated" class="updated">Обновление…</div><div class="header-right"><div id="health" class="status-pill info">ПОДКЛЮЧЕНИЕ</div><a class="tech-link" href="/tech">ТЕХНИЧЕСКИЕ ДЕТАЛИ</a></div></header>
<main>
<section class="hero">
 <div class="panel now"><h1>СЕЙЧАС</h1><div id="nowState" class="now-state">Система ожидает данные</div><div id="nowAction" class="now-action"></div><div id="nowMeta" class="now-meta"></div></div>
 <div class="panel resource-panel"><div class="resource"><div class="resource-head"><span>CPU</span><b id="cpuValue">—</b></div><div class="track"><span id="cpuBar"></span></div></div><div class="resource gpu"><div class="resource-head"><span>GPU</span><b id="gpuValue">—</b></div><div class="track"><span id="gpuBar"></span></div></div><div class="resource ram"><div class="resource-head"><span>ПАМЯТЬ</span><b id="ramValue">—</b></div><div class="track"><span id="ramBar"></span></div></div></div>
</section>
<section class="panel"><div class="eyebrow">Путь закупки</div><div id="pipeline" class="pipeline"></div></section>
<section class="panel"><div class="eyebrow">Сегодня · одна когорта по времени поступления</div><div id="funnel" class="funnel"></div></section>
<section class="panel"><div class="eyebrow">Что требует внимания</div><div id="problems" class="problems"></div></section>
<section class="bottom"><div class="panel"><div class="eyebrow">Последняя активность</div><div id="activity" class="activity-list"></div></div><div class="panel"><div class="eyebrow">Коммерческий контур · второй уровень</div><div id="commercial"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>v==null?'—':Number(v).toLocaleString('ru-RU');
const pct=v=>v==null?'—':`${Math.round(Number(v))}%`;
const stateClass=s=>s==='RUNNING'?'good':s==='FAILED'?'bad':s==='STOPPED'?'warn':s==='OFF'?'off':s==='IDLE'?'info':'info';
const stageName=s=>({ASSESSMENT:'Коммерческая оценка закупки',MODEL_INFERENCE:'Проверка коммерческих категорий',FEEDER:'Передача закупки в обработку',DOCUMENTS:'Обработка документов',NORMALIZATION:'Нормализация строк сметы',AUTONOMOUS:'Автономная обработка'})[String(s||'').toUpperCase()]||'Обработка закупки';
const elapsed=v=>{if(v==null)return '';const x=Math.max(0,Number(v));return x<60?`${x} сек`:`${Math.floor(x/60)} мин ${String(x%60).padStart(2,'0')} сек`;};
const setGauge=(value,label,bar)=>{const x=value==null?null:Math.max(0,Math.min(100,Number(value)));$(label).textContent=pct(x);$(bar).style.width=x==null?'0%':`${x}%`;};
function renderNow(m){const r=m.runtime||{},jobs=r.active_jobs||[],a=r.assessment||{},job=jobs[0],gpu=(r.gpu_processes||[])[0],model=r.gpu_active_model,docs=r.documents||{},norm=r.normalization||{},auto=r.autonomous||{};let proc=job?.procurement_id??a.procurement_id;const aiActive=!!proc||r.gpu_caller==='crm-ai-assessment-runner.service',docsActive=Number(docs.workers_running)>0&&Number(docs.queue_working)>0,normActive=norm.state==='RUNNING',autoActive=auto.state==='active';if(aiActive){$('nowState').textContent=proc?`AI ${'\u0430\u043d\u0430\u043b\u0438\u0437\u0438\u0440\u0443\u0435\u0442'} ${'\u0437\u0430\u043a\u0443\u043f\u043a\u0443'} ${n(proc)}`:'AI-\u043c\u043e\u0434\u0435\u043b\u044c \u043e\u0431\u0440\u0430\u0431\u0430\u0442\u044b\u0432\u0430\u0435\u0442 \u0437\u0430\u0434\u0430\u0447\u0443';$('nowAction').textContent=stageName(job?.action||a.stage);}else if(docsActive){$('nowState').textContent='\u041e\u0431\u0440\u0430\u0431\u0430\u0442\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b \u0437\u0430\u043a\u0443\u043f\u043e\u043a';$('nowAction').textContent=`\u0420\u0430\u0431\u043e\u0442\u0430\u044e\u0442 ${n(docs.workers_running)} \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u0447\u0438\u043a\u043e\u0432`;}else if(normActive){$('nowState').textContent='\u041d\u043e\u0440\u043c\u0430\u043b\u0438\u0437\u0443\u044e\u0442\u0441\u044f \u0441\u0442\u0440\u043e\u043a\u0438 \u0441\u043c\u0435\u0442';$('nowAction').textContent='\u041f\u043e\u0434\u0433\u043e\u0442\u043e\u0432\u043a\u0430 \u0434\u0430\u043d\u043d\u044b\u0445 \u0434\u043b\u044f \u043a\u0430\u0440\u0442\u043e\u0447\u0435\u043a';}else if(autoActive){$('nowState').textContent='\u0410\u0432\u0442\u043e\u043d\u043e\u043c\u043d\u044b\u0439 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u0447\u0438\u043a \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u0437\u0430\u0434\u0430\u0447\u0443';$('nowAction').textContent='\u0420\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0430\u0432\u0442\u043e\u043d\u043e\u043c\u043d\u044b\u0439 \u044d\u0442\u0430\u043f';}else{$('nowState').textContent='\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u043e\u0436\u0438\u0434\u0430\u0435\u0442 \u043d\u043e\u0432\u044b\u0435 \u0437\u0430\u0434\u0430\u0447\u0438';$('nowAction').textContent=r.feeder?.state==='active'?'\u0421\u043b\u0435\u0436\u0435\u043d\u0438\u0435 \u0437\u0430 \u043f\u043e\u0441\u0442\u0443\u043f\u0430\u044e\u0449\u0438\u043c\u0438 \u0437\u0430\u043a\u0443\u043f\u043a\u0430\u043c\u0438 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442':'\u0410\u043a\u0442\u0438\u0432\u043d\u043e\u0439 \u0437\u0430\u043a\u0443\u043f\u043a\u0438 \u0441\u0435\u0439\u0447\u0430\u0441 \u043d\u0435\u0442';}const active=aiActive||docsActive||normActive||autoActive;$('nowMeta').innerHTML=active?`${model?`<span>\u041c\u043e\u0434\u0435\u043b\u044c <strong>${esc(model)}</strong></span>`:''}${job?.elapsed!=null?`<span>\u0412 \u0440\u0430\u0431\u043e\u0442\u0435 <strong>${esc(elapsed(job.elapsed))}</strong></span>`:''}${gpu?`<span>GPU \u0437\u0430\u043d\u044f\u0442 AI-\u043c\u043e\u0434\u0435\u043b\u044c\u044e</span>`:''}${job?.contract?`<span>\u041a\u043e\u043d\u0442\u0440\u0430\u043a\u0442 <strong>${esc(job.contract)}</strong></span>`:''}`:'';const cpu=(m.cpu_detail||{}).busy_pct??m.cpu;setGauge(cpu,'cpuValue','cpuBar');setGauge((m.gpu||{}).util,'gpuValue','gpuBar');setGauge((m.mem||{}).pct,'ramValue','ramBar');}
function renderPipeline(m,t){const r=m.runtime||{},d=r.documents||{},norm=r.normalization||{},c=t.commercial||{},l=t.lifecycle||{},docs=t.documents||{},nm=t.normalization||{};const running=Number((t.ai_states||{}).RUNNING||0),queued=Number((t.ai_states||{}).QUEUED||0),wait=Number((t.ai_states||{}).UNASSESSED||0)+queued;const items=[
 ['ПОСТУПИЛО','good',n(t.received),`${n(t.received)} закупок сегодня`],
 ['ДОПУЩЕНО К ИССЛЕДОВАНИЮ',t.admission_eligible?'good':'info',n(t.admission_eligible),`из ${n(t.received)} поступивших`],
 ['КОММЕРЧЕСКИЙ ОТБОР',c.error?'bad':c.processing?'info':'good',c.processing?`${n(running)} работают`:`${n(c.accepted)} подходят`,`${n(wait)} ждут · ${n(c.rejected)} отклонены · ${n(c.error)} требуют проверки`],
 ['ДОКУМЕНТЫ',d.workers_running>0?'good':'warn',d.workers_running>0?'РАБОТАЮТ':'ОСТАНОВЛЕНЫ',`${n(d.workers_running)}/${n(d.workers_total)} обработчиков · ${n(d.queue_ready)} ждут`],
 ['НОРМАЛИЗАЦИЯ',norm.state==='RUNNING'?'good':norm.state==='OFF'?'warn':'info',norm.state==='OFF'?'ВЫКЛЮЧЕНА':norm.state==='RUNNING'?'РАБОТАЕТ':'ОЖИДАЕТ',`${n(nm.normalized)} готово · ${n(nm.pending)} ожидают`],
 ['ГОТОВЫЕ КАРТОЧКИ',t.ready_cards?.count?'good':'info',n(t.ready_cards?.count),`из ${n(t.ready_cards?.denominator)} сегодняшних`]
 ];$('pipeline').innerHTML=items.map(x=>`<div class="stage"><div class="stage-title">${x[0]}</div><div class="stage-state ${x[1]}">${x[2]}</div><div class="stage-detail">${x[3]}</div></div>`).join('');}
function renderFunnel(t){const c=t.commercial||{},l=t.lifecycle||{},d=t.documents||{},nm=t.normalization||{},ai=t.ai_states||{};const running=Number(ai.RUNNING||0),waiting=Number(ai.UNASSESSED||0)+Number(ai.QUEUED||0);const rows=[
 ['ПОСТУПИЛО',t.received,`procurement · ${esc(t.captured_at||'сегодня')}`],
 ['AI АНАЛИЗИРУЕТСЯ',running,`${waiting} ожидают · из ${n(t.received)} поступивших`],
 ['КОММЕРЧЕСКИ ПОДХОДЯТ',c.accepted,`есть действующая категория · из ${n(t.received)}`],
 ['НЕ ПОДХОДЯТ',c.rejected,`явный коммерческий отказ · из ${n(t.received)}`],
 ['ТРЕБУЮТ ПРОВЕРКИ',c.error,`нет однозначного результата · из ${n(t.received)}`],
 ['ТРЕБУЮТ ДОКУМЕНТОВ',d.needs_research,`из ${n(l.actionable)} активных закупок`],
 ['НОРМАЛИЗОВАНО / ГОТОВО',`${n(nm.normalized)} / ${n(t.ready_cards?.count)}`,`из ${n(nm.denominator)} с разобранными строками`]
 ];$('funnel').innerHTML=rows.map((x,i)=>`<div class="funnel-card"><div class="funnel-label">${x[0]}</div><div class="funnel-value ${i===4&&Number(c.error)>0?'bad':''}">${x[1]}</div><div class="funnel-note">${x[2]}</div></div>`).join('');}
function renderProblems(m,t){const r=m.runtime||{},d=r.documents||{},nm=r.normalization||{},items=[];if(r.autonomous?.state==='failed')items.push(['red','АВТОНОМНЫЙ ОБРАБОТЧИК ЗАВЕРШИЛСЯ С ОШИБКОЙ','Сервис остановлен с ошибкой. Технические подробности — в техническом режиме.']);if(nm.state==='OFF')items.push(['red','НОРМАЛИЗАЦИЯ ВЫКЛЮЧЕНА',`Последний успешный запуск: ${esc(nm.last_success||'не зафиксирован')} · ждут ${n(nm.pending)} строк.`]);if(d.workers_running===0&&(Number(d.queue_ready||0)>0||Number(d.stale||0)>0))items.push(['orange','ОБРАБОТКА ДОКУМЕНТОВ ОСТАНОВЛЕНА',`${n(d.queue_ready)} задач ждут · ${n(d.stale)} записей PROCESSING устарели.`]);if(Number(t.commercial?.error||0)>0)items.push(['orange',`${n(t.commercial.error)} ЗАКУПКИ ТРЕБУЮТ ПРОВЕРКИ`,'AI завершил оценку, но не сохранил явный коммерческий исход.']);$('problems').innerHTML=items.length?items.slice(0,3).map(p=>`<div class="problem ${p[0]}"><div class="problem-title">${p[1]}</div><div class="problem-text">${p[2]}</div></div>`).join(''):'<div class="empty-problems">СРОЧНЫХ ПРОБЛЕМ НЕТ</div>';}
function renderActivity(m){const events=(m.runtime?.events||[]).slice(-20).reverse().slice(0,5);const human=e=>{const s=String(e.stage||'').toLowerCase(),res=String(e.result||'').toUpperCase(),id=e.procurement&&e.procurement!=='—'?`закупка ${e.procurement}`:'';if(s==='assessment')return `${res==='FAILED'?'AI не завершил оценку':res==='DONE'?'AI завершил оценку':'AI начал оценку'} ${id}`.trim();if(s==='feeder')return `Проверены новые коммерческие закупки ${id}`.trim();return `${res==='FAILED'?'Не удалось обработать документы':res==='DONE'?'Завершена обработка документов':'Обновлена обработка документов'} ${id}`.trim();};$('activity').innerHTML=events.length?events.map(e=>`<div class="activity"><span class="activity-time">${esc(String(e.time||'').slice(11,16)||'—')}</span><span class="activity-stage ${String(e.result).toUpperCase()==='FAILED'?'bad':'good'}">${String(e.result).toUpperCase()==='FAILED'?'Ошибка':'Готово'}</span><span class="activity-text">${esc(human(e))}${e.duration?` · ${esc(e.duration)}`:''}</span></div>`).join(''):'<div class="activity-text">Пока нет новых событий обработки</div>';}
function renderCommercial(m){const c=m.command?.commercial||{},open=c.open||{},awarded=c.awarded||{},total=Number(c.live_total||0),medals=['GOLD','SILVER','BRONZE','WOOD'],max=Math.max(1,...medals.map(k=>Number(open[k]||0)));$('commercial').innerHTML=`<div class="commerce-head"><strong>${n(total)}</strong><span>активных коммерческих возможностей</span><span>Идут торги: ${n(Object.values(open).reduce((a,b)=>a+Number(b||0),0))}</span><span>Разыграны: ${n(Object.values(awarded).reduce((a,b)=>a+Number(b||0),0))}</span></div><div class="medal-list">${medals.map(k=>`<div class="medal-row"><span>${k}</span><b>${n(open[k]||0)}</b><div class="medal-track"><span style="width:${Math.min(100,100*Number(open[k]||0)/max)}%"></span></div></div>`).join('')}</div><div class="commercial-extra"><span>Документально подтверждено: ${n(c.document_confirmed_live)}</span><span>Категорийные возможности: ${n(c.category_opportunities_live)}</span></div>`;}
function render(m){const t=m.today_truth||{};if(!t.available){$('health').textContent='ДАННЫЕ КОГОРТЫ НЕДОСТУПНЫ';$('health').className='status-pill bad';$('funnel').innerHTML='<div class="funnel-card">Не удалось подтвердить сегодняшний срез</div>';return;}const active=(m.runtime?.active_jobs||[]).length>0||!!m.runtime?.assessment?.procurement_id;$('health').textContent=active?'ИДЁТ ОБРАБОТКА':'СИСТЕМА ОЖИДАЕТ';$('health').className=`status-pill ${active?'good':'info'}`;$('updated').textContent=`Обновлено ${esc(m.time||'')}`;renderNow(m);renderPipeline(m,t);renderFunnel(t);renderProblems(m,t);renderActivity(m);renderCommercial(m);}
async function tick(){try{const r=await fetch('/api/metrics',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);render(await r.json());}catch(e){$('health').textContent='СВЯЗЬ ПОТЕРЯНА';$('health').className='status-pill bad';}}
window.history.scrollRestoration='manual';window.scrollTo(0,0);window.addEventListener('load',()=>{window.scrollTo(0,0);document.documentElement.scrollLeft=0;document.body.scrollLeft=0;document.documentElement.style.setProperty('direction','ltr','important');document.body.style.setProperty('direction','ltr','important');setTimeout(()=>window.scrollTo(0,0),250);});setInterval(()=>{if(window.scrollX!==0)window.scrollTo(0,0)},1000);tick();setInterval(tick,5000);
</script></body></html>
