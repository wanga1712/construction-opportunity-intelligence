function renderAttention(m,t){var r=m.runtime||{},d=r.documents||{},n=r.normalization||{},a=[];if(r.autonomous&&r.autonomous.state==='failed')a.push(['red',L.autonomousFailed]);if(d.workers_running===0&&(Number(d.queue_ready||0)>0||Number(d.stale||0)>0))a.push(['orange',L.processingDocs+' STOPPED · '+fmt(d.queue_ready)+' '+L.waiting+' · '+fmt(d.stale)+' stale']);if(n.state==='OFF')a.push(['red',L.normalizationOff+' · '+fmt(n.pending)+' '+L.waiting]);if(Number((t.commercial||{}).error||0)>0)a.push(['orange',fmt(t.commercial.error)+' '+('\u0437\u0430\u043a\u0443\u043f\u043e\u043a')+' · '+L.review]);txt('attentionTitle',L.attention);$('attentionList').innerHTML=a.slice(0,3).map(function(x){return'<div class="att-item '+x[0]+'"><span class="att-mark">'+(x[0]==='red'?'!':'●')+'</span><span>'+esc(x[1])+'</span></div>'}).join('')||'<div class="empty">'+('\u0410\u043a\u0442\u0443\u0430\u043b\u044c\u043d\u044b\u0445 \u043f\u0440\u043e\u0431\u043b\u0435\u043c \u043d\u0435\u0442')+'</div>'}
function eventText(e){var s=String(e.stage||'').toLowerCase(),r=String(e.result||'').toUpperCase(),id=e.procurement&&e.procurement!=='—'?' '+('\u0437\u0430\u043a\u0443\u043f\u043a\u0430')+' '+e.procurement:'';if(r==='FAILED')return'\u041e\u0448\u0438\u0431\u043a\u0430 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0438'+id;if(s==='assessment')return(r==='DONE'?'AI \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u043b \u043e\u0446\u0435\u043d\u043a\u0443':'AI \u043e\u0446\u0435\u043d\u0438\u0432\u0430\u0435\u0442')+id;if(s==='feeder')return'\u041f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u044b \u043d\u043e\u0432\u044b\u0435 \u0437\u0430\u043a\u0443\u043f\u043a\u0438';return(r==='DONE'?'\u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u0430 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432':'\u041e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0430 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432')+id}function renderEvents(es){txt('eventsTitle',L.events);var a=(es||[]).slice(-3).reverse();$('eventList').innerHTML=a.length?a.map(function(e){return'<div class="event"><span class="event-time">'+esc(String(e.time||'').slice(11,16)||L.na)+'</span><span class="event-text">'+esc(eventText(e))+'</span></div>'}).join(''):'<div class="empty">'+L.noEvents+'</div>'}
function renderNow(m){var r=m.runtime||{},j=currentTask(m),st=(m.system_status||{}).state||'UNKNOWN';txt('nowEyebrow',L.now);txt('nowTitle',j?j.title:L.waitingTask);txt('nowAction',j?j.action:(r.feeder&&r.feeder.state==='active'?'\u041e\u0436\u0438\u0434\u0430\u0435\u0442 \u043d\u043e\u0432\u044b\u0435 \u0437\u0430\u0434\u0430\u0447\u0438':''));txt('nowElapsed',j&&j.elapsed!==null&&j.elapsed!==undefined?elapsed(j.elapsed)+' \u0432 \u0440\u0430\u0431\u043e\u0442\u0435':'');txt('systemState',st==='CRITICAL'?'CRITICAL':st==='WARNING'?'\u0412\u041d\u0418\u041c\u0410\u041d\u0418\u0415':j?'\u0420\u0410\u0411\u041e\u0422\u0410\u0415\u0422':'\u041e\u0416\u0418\u0414\u0410\u0415\u0422');$('systemState').className='sys '+st}
function pair(label,value){return'<div class="metric"><label>'+esc(label)+'</label><b>'+esc(value)+'</b></div>'}function limit(label,value){return'<div class="limit"><label>'+esc(label)+'</label><b>'+esc(value)+'</b></div>'}function renderHardware(m){var c=m.cpu_detail||{},cap=c.cap||{},cores=Array.isArray(c.per)?c.per:[],t=m.temperatures||{},g=m.gpu||{},ram=m.mem||{};txt('cpuLead',pct(c.busy_pct??c.total)+' · '+temp(t.display??t.package)+' · '+mhz(cap.cur_mhz??c.freq_mhz));$('coreSummary').innerHTML=cores.map(function(v,i){return '<span class=\"core-value\">C'+i+' <b>'+esc(pct(v))+'</b></span>'}).join('');txt('cpuCapSummary',L.maxPerf+' '+pct(cap.cap_pct)+' · '+L.freqCap+' '+mhz(cap.scaling_max_mhz)+' · Turbo '+(cap.no_turbo===null||cap.no_turbo===undefined?L.na:cap.no_turbo?'OFF':'ON'));txt('gpuLead',pct(g.util)+' · '+temp(g.temp)+' · '+fmt(g.power,1)+' / '+fmt(g.limit,1)+' W');txt('gpuVram',gb(g.vram_used)+' / '+gb(g.vram_total));txt('ramLead',pct(ram.pct)+' · '+fmt(ram.used,1)+' / '+fmt(ram.total,1)+' GB')}
function sum(o){if(!o||typeof o!=='object')return null;var a=Object.values(o);if(!a.length||a.some(function(x){return x===null||x===undefined||!isFinite(Number(x))}))return null;return a.reduce(function(x,y){return x+Number(y)},0)}function renderOpsCommercial(m){var c=((m.command||{}).commercial)||{},o=c.open||{},a=c.awarded||{},keys=[['G','GOLD'],['S','SILVER'],['B','BRONZE'],['W','WOOD']];txt('commercialTotal',fmt(c.live_total));txt('openTotal',fmt(sum(o)));txt('awardedTotal',fmt(sum(a)));$('commercialMedals').innerHTML=[['OPEN',o],['AWARDED',a]].map(function(group){return '<div class=\"medal-group\"><b>'+group[0]+'</b>'+keys.map(function(k){return '<span>'+k[0]+' '+fmt(group[1][k[1]])+'</span>'}).join('')+'</div>'}).join('')}
function render(m){if(!m)return;txt('clock',new Date().toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit'}));renderNow(m);renderPipeline(m.today_truth||{},m.runtime||{});renderAttention(m,m.today_truth||{});renderEvents((m.runtime||{}).events);renderHardware(m);renderOpsCommercial(m);auditLayout()}async function tick(){try{var r=await fetch('/api/metrics',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json())}catch(e){txt('systemState','\u041d\u0415\u0422 \u0421\u0412\u042f\u0417\u0418');$('systemState').className='sys CRITICAL';auditLayout()}}tick();setInterval(tick,3000);
</script></body></html>
