[Service]
# Run bounded batches only during the daily window. The runner exits when the
# eligible backlog is drained or after the three-hour runtime cap.
ExecStart=
ExecStart=/opt/CRM_Streamlit/.venv313/bin/python /opt/CRM_Streamlit/src/services/crm_ai_assessment_runner.py --drain --limit 300 --max-runtime-sec 10800
Environment=CRM_V3_OLLAMA_KEEP_ALIVE=5m
TimeoutStartSec=12600
