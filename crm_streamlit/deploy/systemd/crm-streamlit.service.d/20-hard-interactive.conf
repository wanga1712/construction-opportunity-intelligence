# Hard interactive priority + memory residency for CRM UI (cgroup v2).
# Measured Streamlit RSS ~220–250 MiB idle/normal → Min/Low sized with headroom.
# MemorySwapMax=0 keeps CRM pages resident under AI memory pressure.

[Service]
CPUWeight=800
IOWeight=500
# No AllowedCPUs restriction: CRM may use reserved interactive CPUs and others.
MemoryMin=384M
MemoryLow=768M
MemorySwapMax=0
OOMScoreAdjust=-300
Nice=-10
